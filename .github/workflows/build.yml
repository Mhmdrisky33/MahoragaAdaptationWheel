name: Build Mahoraga Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract mod ZIP
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP mod tidak ditemukan"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name build.gradle -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "build.gradle tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      - name: Build mod
        run: gradle -p "$PROJECT_DIR" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MahoragaAdaptationWheel
          path: extracted/**/build/libs/*.jar
